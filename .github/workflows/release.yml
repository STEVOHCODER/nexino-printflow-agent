name: Build and Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.2.0). Leave empty to auto-bump patch.'
        required: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get current version
        id: version
        shell: pwsh
        run: |
          $pkg = Get-Content electron/package.json | ConvertFrom-Json
          $current = $pkg.version
          echo "current=$current" >> $env:GITHUB_OUTPUT
          echo "Current version: $current"

      - name: Determine version tag
        id: tag
        shell: pwsh
        run: |
          $input = "${{ github.event.inputs.version }}"
          $current = "${{ steps.version.outputs.current }}"
          if ($input -ne "") {
            $tag = $input
            $ver = $input -replace '^v', ''
          } else {
            $parts = $current -split '\.'
            $patch = [int]$parts[2] + 1
            $ver = "$($parts[0]).$($parts[1]).$patch"
            $tag = "v$ver"
          }

          # Check if tag already exists, if so bump again
          $exists = git tag -l $tag
          while ($exists) {
            $parts = $ver -split '\.'
            $patch = [int]$parts[2] + 1
            $ver = "$($parts[0]).$($parts[1]).$patch"
            $tag = "v$ver"
            $exists = git tag -l $tag
          }

          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "Tag: $tag, Version: $ver"

      - name: Update package.json version
        shell: pwsh
        run: |
          $ver = "${{ steps.tag.outputs.version }}"
          $pkg = Get-Content electron/package.json -Raw | ConvertFrom-Json
          $pkg.version = $ver
          $pkg | ConvertTo-Json -Depth 10 | Set-Content electron/package.json
          echo "Updated electron/package.json to $ver"

      - name: Install dependencies
        working-directory: electron
        run: npm install

      - name: Build Windows installer
        working-directory: electron
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Nexino Print Agent ${{ steps.tag.outputs.tag }}
          body: |
            ## Nexino Print Agent ${{ steps.tag.outputs.tag }}

            ### What's New
            - Pre-flight hardware check (printer status verified before payment)
            - Network resilience (idempotency keys, crash recovery)
            - Download integrity verification (SHA-256)
            - Auto-update support

            ### Installation
            1. Download `Nexino Print Agent Setup ${{ steps.tag.outputs.version }}.exe`
            2. Run the installer
            3. The app will auto-detect future updates

            ### Auto-Update
            Existing users will be notified of this update automatically in the app.
          files: |
            electron/dist-installer/Nexino Print Agent Setup ${{ steps.tag.outputs.version }}.exe
            electron/dist-installer/latest.yml
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add electron/package.json
          git commit -m "chore: bump version to ${{ steps.tag.outputs.tag }}" || echo "No changes to commit"
